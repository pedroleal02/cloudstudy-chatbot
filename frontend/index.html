<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação do Chatbot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>Chatbot - Protótipo Local</h2>
    </div>

    <!-- Área onde as mensagens serão exibidas -->
    <div id="chat-messages" class="chat-messages">
      <div class="message bot-message">Olá! Sou o seu assistente. Como posso ajudar?</div>
    </div>

    <!-- Campo de entrada e botão -->
    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off">
      <button id="send-btn">Enviar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
